name: CI

on:
  push:
    branches: ['main', '001-personalized-figurine-store']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager"; do not also set it
      # here or pnpm/action-setup errors on "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Browser E2E: the buyer journey + consent gating against a production build with
  # mocked /api/gl (deterministic, no backend needed).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter storefront build
      - run: pnpm --filter storefront exec playwright install chromium --with-deps
      - run: pnpm --filter storefront test:e2e

  # Mobile performance budget (T072): the shop is sold from phone ads, so a regression
  # in LCP/CLS on the landing page or the constructor has to fail the build, not be
  # discovered by customers. Thresholds live in apps/storefront/lighthouserc.json.
  lighthouse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/storefront
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm --filter storefront build
        working-directory: .
      - run: npx --yes @lhci/cli@0.14.x autorun --config=lighthouserc.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: apps/storefront/.lighthouseci
          retention-days: 7

  # Medusa keeps its own npm install (outside the pnpm workspace), so its unit
  # tests — the legal invariants: free defaults, per-line withdrawal right, Omnibus —
  # run in a separate job.
  medusa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/medusa
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: giftlab
          POSTGRES_PASSWORD: giftlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/medusa/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:unit
      # contract tests boot the app against a throwaway database on the service container
      - run: npm run test:integration:http
        env:
          DB_USERNAME: giftlab
          DB_PASSWORD: giftlab
          DB_HOST: localhost
          JWT_SECRET: test-secret
          COOKIE_SECRET: test-secret
